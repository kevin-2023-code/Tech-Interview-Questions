name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Offline on purpose. A live --check here would fail every time the site
      # gained a question between the sync and the pull request, which is normal
      # and is not the contributor's problem. What CI owes a contributor is that
      # the renderers still work; the hourly job owns whether the tables are
      # current.
      - name: Unit tests (fixture, no network)
        run: python3 -m unittest discover scripts -v

      - name: Render the fixture and enforce the byte budgets
        run: |
          python3 scripts/sync.py \
            --catalog-file scripts/fixtures/catalog-sample.json \
            --today 2026-09-11 \
            --quiet
          git diff --stat
          git checkout -- . && git clean -fd companies formats by-month data
