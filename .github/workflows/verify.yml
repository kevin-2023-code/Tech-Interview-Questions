name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Not on the hourly sync's own commits. This job tests the RENDERERS, and a
    # sync commit changes no renderer — it changes what they produced. Without
    # this the repository would run a full CI job every hour, for ever, to
    # re-prove code that did not change.
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Offline on purpose. A live --check here would fail every time the site
      # gained a question between the last sync and the pull request, which is
      # normal and is not the contributor's problem. What CI owes a contributor
      # is that the renderers still work; the hourly job owns whether the
      # published tables are current.
      - name: Unit tests (fixture, no network)
        run: python3 -m unittest discover scripts -v

      - name: Render the fixture and enforce the byte budgets
        # In a COPY of the repository, so the fixture's synthetic rows cannot be
        # confused with the real ones in the checkout — and so a failure here
        # leaves nothing behind to explain.
        run: |
          cp -r . "$RUNNER_TEMP/render-check"
          cd "$RUNNER_TEMP/render-check"
          rm -rf companies formats by-month data
          python3 scripts/sync.py \
            --catalog-file scripts/fixtures/catalog-sample.json \
            --today 2026-09-11

      - name: Re-render must be a no-op
        # The determinism the hourly job depends on: if a second pass over the
        # same snapshot still finds work, every sync commits noise for ever.
        run: |
          cd "$RUNNER_TEMP/render-check"
          python3 scripts/sync.py \
            --catalog-file scripts/fixtures/catalog-sample.json \
            --today 2026-09-11 \
            --check
