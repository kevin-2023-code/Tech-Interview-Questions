name: Sync question bank

# Hourly, because the product here is freshness: the 🔥/🆕 markers expire on a
# clock, so a run that finds no new questions still has work to do. Offset off
# the hour so this is not competing with everything else scheduled at :00.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never two syncs at once — both would render from a different read of a live
# catalog and the second would commit over the first. Queue, do not cancel: a
# cancelled run leaves the repository a sync behind for an hour.
concurrency:
  group: sync-question-bank
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify the renderers before pointing them at live data
        run: python3 -m unittest discover scripts -v

      - name: Sync from the live catalog
        run: python3 scripts/sync.py

      - name: Confirm the result is self-consistent
        # Re-rendering what was just written must produce no further change. A
        # second pass that still finds work means the render is not a pure
        # function of the snapshot, which would make the hourly job commit noise
        # for ever. --catalog-file so this costs no second read of the API.
        run: |
          python3 scripts/sync.py --snapshot-out /tmp/snapshot.json --quiet
          python3 scripts/sync.py --catalog-file /tmp/snapshot.json --check

      - name: Commit
        run: |
          if git diff --quiet; then
            echo "Question bank is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md companies formats by-month data
          git commit -m "Sync question bank from trueinterview.io"
          git push
